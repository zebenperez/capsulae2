<button type="button" class="{% if icon %}project-icon-btn{% else %}payments-page-btn{% endif %} ark{% if active == page_number %} is-active{% endif %}" title="{{ label }}" data-url="{% url "payment-list" %}" data-target="payment-list" data-page="{{ page_number }}" data-q="{{ payment_filters.q|default:"" }}" data-status="{{ payment_filters.status|default:"" }}" data-payment_type="{{ payment_filters.payment_type|default:"" }}" data-project="{{ payment_filters.project|default:"" }}" data-financier="{{ payment_filters.financier|default:"" }}" data-creditor="{{ payment_filters.creditor|default:"" }}" data-date_from="{{ payment_filters.date_from|default:"" }}" data-date_to="{{ payment_filters.date_to|default:"" }}" data-ordering="{{ payment_filters.ordering|default:"due_asc" }}">{% if icon %}<i class="fas {{ icon }}"></i>{% else %}{{ label }}{% endif %}</button>
