{% load i18n %}

<div class="row align-items-center mb-3">
    <div class="col">
        <h2 class="mb-0">{% trans "Crear producto" %}</h2>
    </div>
    <div class="col-auto">
        <button type="button" class="btn" data-bs-dismiss="modal" title="{% trans 'Cerrar' %}">
            <i class="fas fa-times"></i>
        </button>
    </div>
</div>

<form method="post" action="{% url 'product-new' %}">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label" for="product-code">{% trans "Código" %}</label>
        <input class="form-control" id="product-code" name="code" type="text" required autofocus>
    </div>
    <div class="mb-4">
        <label class="form-label" for="product-name">{% trans "Nombre" %}</label>
        <input class="form-control" id="product-name" name="name" type="text" required>
    </div>
    <div class="d-flex justify-content-end" style="gap: .5rem;">
        <button type="button" class="btn btn-sm" data-bs-dismiss="modal">{% trans "Cancelar" %}</button>
        <button type="submit" class="btn btn-sm new">
            <i class="fas fa-save"></i> {% trans "Guardar" %}
        </button>
    </div>
</form>
