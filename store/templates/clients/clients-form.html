{% load i18n %}

<div class="provider-form">
    <div class="provider-form-header">
        <div>
            <h2>{% trans 'Cliente' %}</h2>
            <p>{% trans 'Información de contacto y facturación.' %}</p>
        </div>
        <button type="button" class="btn" data-bs-dismiss="modal" title="{% trans 'Close' %}"><i class="fas fa-times"></i></button>
    </div>

    <div id="div-notification"></div>

    <div class="row provider-form-fields">
        <div class="col-4">
            <label class="label" for="code">{% trans 'Código' %}</label>
            <input type="text" class="form-control autosave" id="code" name="code" value="{{obj.code|default:''}}"
                data-model-name="store.client" data-obj-id="{{obj.id}}" data-url="{% url 'autosave_field' %}"
                data-target="div-notification" placeholder="{% trans 'Código' %}">
            <span id="code__msg"></span>
        </div>
        <div class="col-8">
            <label class="label" for="name">{% trans 'Nombre' %}</label>
            <input type="text" class="form-control autosave" id="name" name="name" value="{{obj.name|default:''}}"
                data-model-name="store.client" data-obj-id="{{obj.id}}" data-url="{% url 'autosave_field' %}"
                data-target="div-notification" placeholder="{% trans 'Nombre' %}">
            <span id="name__msg"></span>
        </div>
        <div class="col-4 mt-3">
            <label class="label" for="dni">{% trans 'DNI' %}</label>
            <input type="text" class="form-control autosave" id="dni" name="dni" value="{{obj.dni|default:''}}"
                data-model-name="store.client" data-obj-id="{{obj.id}}" data-url="{% url 'autosave_field' %}"
                data-target="div-notification" placeholder="{% trans 'DNI' %}">
            <span id="dni__msg"></span>
        </div>
        <div class="col-4 mt-3">
            <label class="label" for="phone">{% trans 'Teléfono' %}</label>
            <input type="text" class="form-control autosave" id="phone" name="phone" value="{{obj.phone|default:''}}"
                data-model-name="store.client" data-obj-id="{{obj.id}}" data-url="{% url 'autosave_field' %}"
                data-target="div-notification" placeholder="{% trans 'Teléfono' %}">
            <span id="phone__msg"></span>
        </div>
        <div class="col-4 mt-3">
            <label class="label" for="email">{% trans 'Correo electrónico' %}</label>
            <input type="email" class="form-control autosave" id="email" name="email" value="{{obj.email|default:''}}"
                data-model-name="store.client" data-obj-id="{{obj.id}}" data-url="{% url 'autosave_field' %}"
                data-target="div-notification" placeholder="{% trans 'Correo electrónico' %}">
            <span id="email__msg"></span>
        </div>
        <div class="col-12 mt-3">
            <label class="label" for="address">{% trans 'Dirección' %}</label>
            <input type="text" class="form-control autosave" id="address" name="address" value="{{obj.address|default:''}}"
                data-model-name="store.client" data-obj-id="{{obj.id}}" data-url="{% url 'autosave_field' %}"
                data-target="div-notification" placeholder="{% trans 'Dirección' %}">
            <span id="address__msg"></span>
        </div>
        <input type="hidden" id="company" name="company" value="{{store_company.id}}">
    </div>

    <div class="provider-form-actions">
        <button type="button" class="btn btn-sm save" data-bs-dismiss="modal">{% trans 'Cancelar' %}</button>
        {% if obj %}
            <button type="button" class="btn btn-sm ark save" data-bs-dismiss="modal" data-url="{% url 'clients-list' %}"
                data-target="clients-list"><i class="fas fa-save"></i> {% trans 'Guardar' %}</button>
        {% else %}
            <button type="button" class="btn btn-sm ark_new_obj save" data-bs-dismiss="modal" data-url="{% url 'clients-list' %}"
                data-target="clients-list" data-url-save="{% url 'autosave_fields' %}"
                data-args-save="code,name,dni,phone,email,address,company" data-model-name="store.client">
                <i class="fas fa-save"></i> {% trans 'Guardar' %}
            </button>
        {% endif %}
    </div>
</div>
